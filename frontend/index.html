<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3d7eff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233d7eff'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-size='44' fill='white'%3E%C2%A5%3C/text%3E%3C/svg%3E">
<title>家庭记账</title>
<script src="/vendor/vue.global.prod.js"></script>
<link rel="stylesheet" href="/styles/app.css">
</head>
<body>
<noscript>请启用 JavaScript 后使用家庭记账。</noscript>
<div id="app" v-cloak>
  <div class="status-bar" :class="{warning: !ready || cacheWarning}" role="status" aria-live="polite">
    <div class="message">{{ syncLabel }}<span v-if="syncError"> · {{ syncError }}</span><span v-if="cacheWarning"> · {{ cacheWarning }}</span></div>
    <button @click="reloadData" :disabled="busy">重新加载账本</button>
  </div>
  <div class="status-bar warning" v-if="hasLegacy">
    <div class="message">检测到旧版浏览器缓存，未自动覆盖数据库。可在设置中导出旧版备份，核对后手动恢复。</div>
  </div>

  <detail-page v-if="tab==='detail'"></detail-page>

  <stats-page v-if="tab==='stats'"></stats-page>

  <settings-page v-if="tab==='settings'"></settings-page>

  <tab-bar></tab-bar>

  <invest-page v-if="tab==='invest'"></invest-page>

  <record-drawer v-if="drawer"></record-drawer>

  <!-- toast / 确认框 -->
  <div class="toast" v-if="toast" role="status" aria-live="polite">{{ toast }}</div>
  <confirm-dialog v-if="modal"></confirm-dialog>

</div>

<script src="/js/view-context.js"></script>
<script src="/pages/detail.js"></script>
<script src="/pages/stats.js"></script>
<script src="/pages/invest.js"></script>
<script src="/pages/settings.js"></script>
<script src="/components/tab-bar.js"></script>
<script src="/components/record-drawer.js"></script>
<script src="/components/confirm-dialog.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
